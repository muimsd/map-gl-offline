<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map-gl-offline demo</title>
    <meta
      name="description"
      content="Download a map region, then use it with no connection. Live demo of map-gl-offline for MapLibre GL and Mapbox GL."
    />
    <meta name="theme-color" content="#12332d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="stylesheet" href="./src/styles/demo.css" />
  </head>
  <body>
    <div class="sheet" id="app">
      <header class="sheet-head">
        <h1 class="sheet-title">map-gl-offline</h1>
        <div class="renderer-switch" role="group" aria-label="Map renderer">
          <button id="tab-maplibre" type="button" aria-pressed="true">MapLibre GL</button>
          <button id="tab-mapbox" type="button" aria-pressed="false">Mapbox GL</button>
        </div>
        <nav class="sheet-links" aria-label="Project links">
          <a href="https://map-gl-offline.netlify.app/">Docs</a>
          <a href="https://github.com/muimsd/map-gl-offline">GitHub</a>
        </nav>
      </header>

      <div class="collar collar-lon" id="collar-lon" data-axis="lon" aria-hidden="true"></div>
      <div class="collar collar-lat" id="collar-lat" data-axis="lat" aria-hidden="true"></div>

      <main class="neatline">
        <div id="map-maplibre" class="sheet-map"></div>
        <div id="map-mapbox" class="sheet-map hidden"></div>
      </main>

      <footer class="sheet-foot">
        <span id="readout-position"></span>
        <span id="readout-zoom"></span>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
